openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: StoryBloom API – AI children's story generation and management
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stories
    description: Story operations
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /stories:
    get:
      operationId: listStories
      tags: [stories]
      summary: List all saved stories
      responses:
        "200":
          description: List of stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Story"

    post:
      operationId: createStory
      tags: [stories]
      summary: Create and generate a new story
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "201":
          description: Story created and generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stories/stats:
    get:
      operationId: getStoryStats
      tags: [stories]
      summary: Get story statistics (total count, by theme)
      responses:
        "200":
          description: Story statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryStats"

  /stories/recent:
    get:
      operationId: getRecentStories
      tags: [stories]
      summary: Get the 5 most recently created stories
      responses:
        "200":
          description: Recent stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Story"

  /stories/{id}:
    get:
      operationId: getStory
      tags: [stories]
      summary: Get a single story by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Story found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          description: Story not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateStory
      tags: [stories]
      summary: Edit/update a story's content or metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryUpdate"
      responses:
        "200":
          description: Story updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          description: Story not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteStory
      tags: [stories]
      summary: Delete a story
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Story deleted
        "404":
          description: Story not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stories/{id}/regenerate:
    post:
      operationId: regenerateStory
      tags: [stories]
      summary: Regenerate a story with the same parameters
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Story regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          description: Story not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          type: object
          properties:
            name:
              type: string
            size:
              type: integer
            contentType:
              type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Story:
      type: object
      required:
        - id
        - childName
        - childAge
        - childGender
        - theme
        - content
        - title
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        childName:
          type: string
        childAge:
          type: integer
        childGender:
          type: string
        milestones:
          type: ["string", "null"]
        theme:
          type: string
        customPrompt:
          type: ["string", "null"]
        bibleVerse:
          type: ["string", "null"]
        referenceImagePaths:
          type: ["string", "null"]
          description: JSON array of uploaded reference image object paths
        coverImageUrl:
          type: ["string", "null"]
          description: AI-generated cover image URL
        illustrationUrls:
          type: ["string", "null"]
          description: JSON array of AI-generated in-story illustration URLs
        title:
          type: string
        content:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    StoryInput:
      type: object
      required:
        - childName
        - childAge
        - childGender
        - theme
      properties:
        childName:
          type: string
          minLength: 1
        childAge:
          type: integer
          minimum: 1
          maximum: 18
        childGender:
          type: string
          enum: [boy, girl]
        milestones:
          type: string
          description: Details like favorite toys, pets, recent trips
        theme:
          type: string
          enum: [Courage, Kindness, "Overcoming Fear", Faith, Friendship, Honesty, Perseverance, Gratitude,
                 Forgiveness, Compassion, Patience, Generosity, Humility, Loyalty, Joy, Hope, Love,
                 Self-Control, Trustworthiness, Responsibility, Creativity, Curiosity, Adventure,
                 Teamwork, Respect, Empathy, Sharing, Diligence, Contentment, Bravery, Wisdom,
                 Acceptance, Thankfulness, Service, Peacemaking, Integrity, Helpfulness, Wonder,
                 "Kindergarten Graduation", "Middle School Graduation", "High School Graduation",
                 "First Day of Kindergarten", "First Day of 1st Grade", "First Day of 2nd Grade",
                 "First Day of 3rd Grade", "First Day of 4th Grade", "First Day of 5th Grade",
                 "First Day of 6th Grade", "First Day of 7th Grade", "First Day of 8th Grade",
                 "First Day of 9th Grade", "First Day of 10th Grade", "First Day of 11th Grade",
                 "First Day of 12th Grade", Congratulations]
        customPrompt:
          type: string
          description: Custom topic or plot prompt
        bibleVerse:
          type: string
          description: '"auto" to let AI choose a fitting verse, or a specific verse reference/text'
        referenceImagePaths:
          type: string
          description: JSON array of uploaded reference image object paths

    StoryUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        childName:
          type: string
        childAge:
          type: integer
        childGender:
          type: string
        milestones:
          type: string
        theme:
          type: string
        customPrompt:
          type: string
        bibleVerse:
          type: string

    StoryStats:
      type: object
      required:
        - totalStories
        - byTheme
        - mostRecentChildName
      properties:
        totalStories:
          type: integer
        byTheme:
          type: array
          items:
            $ref: "#/components/schemas/ThemeCount"
        mostRecentChildName:
          type: ["string", "null"]

    ThemeCount:
      type: object
      required:
        - theme
        - count
      properties:
        theme:
          type: string
        count:
          type: integer
